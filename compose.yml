services:
  # ============================================================
  # React (port: 3000)
  #   Go バックエンド (host: 1099) を直接叩く
  # ============================================================
  react:
    build:
      context: ${REACT_FRONTEND_PATH}
      dockerfile: Dockerfile.develop
    command: sh -c "yarn start"
    environment:
      NODE_ENV: development
      # Go バックエンド (make go-up でホスト起動) に直接接続する
      REACT_APP_API_BASE: http://localhost:1099
      REACT_APP_BACKEND_DOMAIN_API: http://localhost:1099/api/v1
    volumes:
        - ./${REACT_FRONTEND_PATH}:/usr/src/datecourses
    ports:
      - "${REACT_FRONTEND_PORT}:3000"

  # ============================================================
